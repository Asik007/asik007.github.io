# just a basic python ci-cd workflow to run a python package during each build

name: Render CV to PDF

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:



  # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false


env:
  BUILD_PATH: "./src/content/cv" # default value when not using subfolders
  # BUILD_PATH: subfolder

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Download python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Install the dependencies
      - name: Install dependencies
        run: |
          pip install "rendercv[full]"

      # Run the python script to render the cv to pdf
      - name: Render CV to PDF
        run: |
          # Update 'render_script.py' to the actual name/path of your Python script
          rendercv render cv.yml -nomd -nohtml -nopng --pdf-path ./cv.pdf
        
      # Upload the generated files as an artifact for the deploy job
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This should point to the folder containing your generated PDF (and an index.html if needed)
          path: ${{ env.BUILD_PATH }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


