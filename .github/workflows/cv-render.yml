name: Render CV to PDF

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CV_PATH: "./src/content/cv/cv.yml"  # Path to your cv.yml file
  OUTPUT_DIR: "./public"              # Directory to deploy to GitHub Pages

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "rendercv[full]"

      - name: Render CV to PDF & Prepare Pages Directory
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          # Render CV directly into the output directory
          rendercv render ${{ env.CV_PATH }} -nomd -nohtml -nopng --pdf-path ${{ env.OUTPUT_DIR }}/cv.pdf

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5